openapi: 3.0.3
info:
  title: School LMS API
  version: 1.0.0
  description: School LMS backend API
paths:
  /api/v1/courses/:
    get:
      operationId: api_v1_courses_list
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseRead'
          description: ''
  /api/v1/courses/{id}/:
    get:
      operationId: api_v1_courses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRead'
          description: ''
  /api/v1/demo/learning-goal/:
    get:
      operationId: api_v1_demo_learning_goal_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningGoalInput'
          description: ''
    post:
      operationId: api_v1_demo_learning_goal_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningGoalInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LearningGoalInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LearningGoalInput'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningGoalInput'
          description: ''
components:
  schemas:
    CourseRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          type: string
          readOnly: true
        school_class:
          type: string
          readOnly: true
        teacher:
          type: string
          nullable: true
          readOnly: true
        year:
          type: string
          readOnly: true
      required:
      - id
      - school_class
      - subject
      - teacher
      - year
    LearningGoalInput:
      type: object
      properties:
        title:
          type: string
        goal:
          type: string
      required:
      - goal
      - title
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
